<!-- @dsCard group="Slide Layouts" name="01 Title (editorial)" subtitle="表紙：セリフ見出し＋構造線" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout — Title (editorial)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{background:#e9edf1;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;}
  .slide{width:100%;aspect-ratio:16/9;background:#FFFFFF;border-left:14px solid #1A2332;display:flex;flex-direction:column;justify-content:center;padding:7% 9%;}
  .eyebrow{font-weight:700;font-size:1.6vw;letter-spacing:.12em;text-transform:uppercase;color:#00B2CA;}
  h1{font-family:"Noto Serif JP",serif;font-weight:700;font-size:4.6vw;line-height:1.4;color:#1A2332;margin-top:2%;border-bottom:.35vw solid #1A2332;padding-bottom:3%;}
  .lead{font-size:1.7vw;color:#6b7280;margin-top:3.5%;line-height:1.7;max-width:80%;}
</style>
</head>
<body>
  <div class="slide">
    <span class="eyebrow">Section / Category</span>
    <h1>セクションの見出しが<br>ここに入ります</h1>
    <p class="lead">導入や要約のリード文を1〜2行で。読者に「何の話か」を最初に伝えます。</p>
  </div>
</body>
</html>
