<!-- @dsCard group="Slide Layouts" name="03 Section Divider (dark)" subtitle="章扉：ダーク背景＋発光ターコイズ" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout — Section Divider (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{background:#e9edf1;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;}
  .slide{width:100%;aspect-ratio:16/9;background:#0D1B2A;display:flex;flex-direction:column;justify-content:center;padding:7% 9%;}
  .eyebrow{font-weight:700;font-size:1.6vw;letter-spacing:.14em;text-transform:uppercase;color:#00D4F0;}
  h2{font-family:"Noto Serif JP",serif;font-weight:700;font-size:4.2vw;line-height:1.45;color:#fff;margin-top:2.5%;text-shadow:0 0 2vw rgba(0,212,240,.35);}
  h2 .glow{color:#00D4F0;}
  .sub{color:#aebfcf;font-size:1.5vw;margin-top:3.5%;}
</style>
</head>
<body>
  <div class="slide">
    <span class="eyebrow">Chapter 02</span>
    <h2>章タイトル、または<br><span class="glow">切り替え</span>の一言。</h2>
    <p class="sub">話題の転換・強調したいパートの前に挟みます。</p>
  </div>
</body>
</html>
